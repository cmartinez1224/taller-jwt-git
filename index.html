<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Taller JWT - Login</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 60px auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background: #2E74B5; color: white; border: none; cursor: pointer; }
    #resultado { margin-top: 20px; padding: 10px; background: #f2f2f2; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Taller: Autenticación con JWT</h2>

  <h3>1. Iniciar sesión</h3>
  <input type="text" id="usuario" placeholder="Usuario (admin)">
  <input type="password" id="clave" placeholder="Contraseña (1234)">
  <button onclick="login()">Iniciar sesión</button>

  <h3>2. Acceder a ruta protegida</h3>
  <button onclick="verPerfil()">Ver perfil (requiere token)</button>

  <div id="resultado">Aquí aparecerán los resultados...</div>

  <script>
    let token = "";

    async function login() {
      const usuario = document.getElementById("usuario").value;
      const clave = document.getElementById("clave").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ usuario, clave })
      });

      const data = await res.json();
      document.getElementById("resultado").textContent = JSON.stringify(data, null, 2);

      if (data.token) {
        token = data.token;
      }
    }

    async function verPerfil() {
      const res = await fetch("/perfil", {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      document.getElementById("resultado").textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
